<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GOLD HUNTER EA — Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#050505;color:#eee;font-family:Arial,sans-serif}
.box{max-width:430px;margin:8vh auto;padding:30px;background:#111;border:1px solid #292929;border-radius:16px}
h1,.gold{color:#f6b91a}input,button{width:100%;padding:13px;margin:7px 0;border-radius:8px}
input{background:#080808;color:#fff;border:1px solid #444}button{background:#f6b91a;color:#111;border:0;font-weight:800;cursor:pointer}
.link{color:#f6b91a;text-align:center;margin-top:12px;cursor:pointer}.msg{margin-top:12px;padding:11px;border-radius:8px;background:#181818}
.err{border:1px solid #713b3b;color:#ffb7b7}.ok{border:1px solid #3c633f;color:#bce7bf}
.wrap{max-width:1100px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center}
.logout{width:auto;padding:10px 18px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0}
.card{background:#111;border:1px solid #292929;border-radius:12px;padding:18px}.num{font-size:28px;color:#f6b91a;font-weight:800}
.panel{background:#111;border:1px solid #292929;border-radius:14px;padding:20px;margin-top:16px}
@media(max-width:700px){.cards{grid-template-columns:1fr 1fr}.wrap{padding:16px}}
</style></head>
<body><div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
let sb;
const app=document.getElementById("app");
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
function showLogin(){
app.innerHTML=`<div class="box"><h1>GOLD HUNTER EA</h1><h2>Login Admin</h2>
<input id="email" type="email" placeholder="Email Admin" autocomplete="username">
<input id="password" type="password" placeholder="Password" autocomplete="current-password">
<button onclick="doLogin()">LOGIN</button><div class="link" onclick="showForgot()">Lupa Password?</div><div id="msg"></div></div>`;
}
async function doLogin(){
document.getElementById("msg").textContent="Memproses...";
const {error}=await sb.auth.signInWithPassword({email:email.value.trim(),password:password.value});
if(error)document.getElementById("msg").innerHTML=`<div class="msg err">${esc(error.message)}</div>`;
}
function showForgot(){
app.innerHTML=`<div class="box"><h1>GOLD HUNTER EA</h1><h2>Reset Password</h2>
<p>Masukkan email Admin. Link reset akan kembali ke halaman Admin online ini.</p>
<input id="email" type="email" placeholder="Email Admin">
<button onclick="sendReset()">KIRIM LINK RESET</button>
<div class="link" onclick="showLogin()">← Kembali ke Login</div><div id="msg"></div></div>`;
}
async function sendReset(){
const e=email.value.trim();
if(!e){document.getElementById("msg").innerHTML='<div class="msg err">Masukkan email Admin.</div>';return}
document.getElementById("msg").textContent="Mengirim...";
const {error}=await sb.auth.resetPasswordForEmail(e,{redirectTo:location.origin+"/admin/"});
document.getElementById("msg").innerHTML=error?`<div class="msg err">${esc(error.message)}</div>`:'<div class="msg ok">Link reset sudah dikirim. Gunakan email recovery TERBARU.</div>';
}
function showNewPassword(){
app.innerHTML=`<div class="box"><h1>GOLD HUNTER EA</h1><h2>Buat Password Baru</h2>
<input id="p1" type="password" placeholder="Password baru">
<input id="p2" type="password" placeholder="Ulangi password baru">
<button onclick="savePassword()">SIMPAN PASSWORD</button><div id="msg"></div></div>`;
}
async function savePassword(){
if(p1.value.length<8){msg2("Password minimal 8 karakter.",true);return}
if(p1.value!==p2.value){msg2("Password tidak sama.",true);return}
msg2("Menyimpan...");
const {error}=await sb.auth.updateUser({password:p1.value});
if(error){msg2(error.message,true);return}
msg2("Password berhasil diubah. Silakan login.");
setTimeout(showLogin,1500);
}
function msg2(t,e=false){document.getElementById("msg").innerHTML=`<div class="msg ${e?"err":"ok"}">${esc(t)}</div>`}
async function logout(){await sb.auth.signOut()}
function dashboard(){
app.innerHTML=`<div class="wrap"><div class="top"><div><h1>GOLD HUNTER EA</h1><b>Admin Dashboard</b></div><button class="logout" onclick="logout()">KELUAR</button></div>
<div class="cards"><div class="card"><div class="num">0</div>Pesanan</div><div class="card"><div class="num">0</div>Menunggu Verifikasi</div><div class="card"><div class="num">0</div>Disetujui</div><div class="card"><div class="num">0</div>Lisensi Aktif</div></div>
<div class="panel"><h2>Admin aktif</h2><p>Login berhasil. Modul pesanan, pembayaran, verifikasi dan lisensi akan kita sambungkan setelah login selesai diuji.</p></div></div>`;
}
async function init(){
if(!window.GH_SUPABASE_URL||!window.GH_SUPABASE_PUBLISHABLE_KEY||window.GH_SUPABASE_PUBLISHABLE_KEY==="PASTE_PUBLISHABLE_KEY_HERE"){
app.innerHTML='<div class="box"><h2>Konfigurasi belum lengkap</h2><p>Isi Publishable Key di config.js.</p></div>';return}
sb=window.supabase.createClient(window.GH_SUPABASE_URL,window.GH_SUPABASE_PUBLISHABLE_KEY);
sb.auth.onAuthStateChange((event,session)=>{
if(event==="PASSWORD_RECOVERY"){showNewPassword();return}
session?dashboard():showLogin();
});
const {data:{session}}=await sb.auth.getSession();
location.hash.includes("type=recovery")?showNewPassword():session?dashboard():showLogin();
}
init();
</script></body></html>
