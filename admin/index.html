<style>
*{box-sizing:border-box}

.num{

.info{

  border-radius:9px;

}

.info b{

}

  .cards{
    grid-template-columns:1fr 1fr

</head>

<body>

<div id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<script>

let sb;

const app=document.getElementById("app");

let payments=[];

let currentPayment=null;

let packages=[];


/* =========================================================
   ESCAPE HTML
========================================================= */

function esc(s){

  return String(s??"").replace(
    /[&<>"']/g,
    function(m){
      return {
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
      }[m];
    }
  );

}


/* =========================================================
   LOGIN
========================================================= */

function showLogin(){

  app.innerHTML=`
  <div class="box">

    <h1>GOLD HUNTER EA</h1>

    <h2>Login Admin</h2>

    <input
      id="email"
      type="email"
      placeholder="Email Admin"
      autocomplete="username"
    >

    <input
      id="password"
      type="password"
      placeholder="Password"
      autocomplete="current-password"
    >

    <button onclick="doLogin()">LOGIN</button>

    <div
      class="link"
      onclick="showForgot()"
    >
      Lupa Password?
    </div>

    <div id="msg"></div>

  </div>
  `;

}


async function doLogin(){

  const msg=document.getElementById("msg");

  msg.textContent="Memproses...";

  const {error}=await sb.auth.signInWithPassword({
    email:email.value.trim(),
    password:password.value
  });

  if(error){

    msg.innerHTML=
      `<div class="msg err">${esc(error.message)}</div>`;

  }

}


/* =========================================================
   RESET PASSWORD
========================================================= */

function showForgot(){

  app.innerHTML=`
  <div class="box">

    <h1>GOLD HUNTER EA</h1>

    <h2>Reset Password</h2>

    <p>
      Masukkan email Admin.
      Link reset akan kembali ke halaman Admin.
    </p>

    <input
      id="email"
      type="email"
      placeholder="Email Admin"
    >

    <button onclick="sendReset()">
      KIRIM LINK RESET
    </button>

    <div
      class="link"
      onclick="showLogin()"
    >
      ← Kembali ke Login
    </div>

    <div id="msg"></div>

  </div>
  `;

}


async function sendReset(){

  const e=email.value.trim();

  if(!e){

    document.getElementById("msg").innerHTML=
      `<div class="msg err">
        Masukkan email Admin.
      </div>`;

    return;
  }

  document.getElementById("msg").textContent=
    "Mengirim...";

  const {error}=
    await sb.auth.resetPasswordForEmail(
      e,
      {
        redirectTo:
          location.origin+"/admin/"
      }
    );

  document.getElementById("msg").innerHTML=
    error
      ? `<div class="msg err">
          ${esc(error.message)}
        </div>`
      : `<div class="msg ok">
          Link reset sudah dikirim.
          Gunakan email recovery TERBARU.
        </div>`;

}


function showNewPassword(){

  app.innerHTML=`
  <div class="box">

    <h1>GOLD HUNTER EA</h1>

    <h2>Buat Password Baru</h2>

    <input
      id="p1"
      type="password"
      placeholder="Password baru"
    >

    <input
      id="p2"
      type="password"
      placeholder="Ulangi password baru"
    >

    <button onclick="savePassword()">
      SIMPAN PASSWORD
    </button>

    <div id="msg"></div>

  </div>
  `;

}


async function savePassword(){

  if(p1.value.length<8){

    msg2(
      "Password minimal 8 karakter.",
      true
    );

    return;
  }

  if(p1.value!==p2.value){

    msg2(
      "Password tidak sama.",
      true
    );

    return;
  }

  msg2("Menyimpan...");

  const {error}=
    await sb.auth.updateUser({
      password:p1.value
    });

  if(error){

    msg2(
      error.message,
      true
    );

    return;
  }

  msg2(
    "Password berhasil diubah. Silakan login."
  );

  setTimeout(
    showLogin,
    1500
  );

}


function msg2(t,e=false){

  document.getElementById("msg").innerHTML=
    `<div class="msg ${e?"err":"ok"}">
      ${esc(t)}
    </div>`;

}


async function logout(){

  await sb.auth.signOut();

}


/* =========================================================
   LOAD PAYMENT DATA
========================================================= */

async function loadPayments(){

  const panel=
    document.getElementById("payments-panel");

  if(panel){

    panel.innerHTML=
      "<p>Memuat pembayaran...</p>";

  }

  try{

    const {data:{session}} = await sb.auth.getSession();

    if(!session || !session.access_token){
      throw new Error("Sesi Admin tidak ditemukan. Silakan login ulang.");
    }

    const response=
      await fetch(
        "/.netlify/functions/admin-payments",
        {
          method:"GET",
          headers:{
            "Authorization": "Bearer "+session.access_token,
            "Content-Type": "application/json"
          }
        }
      );

    const data=
      await response.json();

    if(!response.ok){

      throw new Error(
        data.message ||
        "Gagal mengambil pembayaran."
      );

    }

    payments=
      data.payments || [];

    renderPayments();

    updateStats();

  }catch(error){

    if(panel){

      panel.innerHTML=
        `<div class="msg err">
          ${esc(error.message)}
        </div>`;

    }

  }

}


/* =========================================================
   LOAD LICENSE PACKAGES
========================================================= */

async function loadPackages(){

  try{

    const response=
      await fetch(
        window.GH_SUPABASE_URL +
        "/rest/v1/license_packages" +
        "?select=*&is_active=eq.true" +
        "&order=sort_order.asc",
        {
          headers:{
            "apikey":
              window.GH_SUPABASE_PUBLISHABLE_KEY,

            "Authorization":
              "Bearer "+
              window.GH_SUPABASE_PUBLISHABLE_KEY
          }
        }
      );

    if(!response.ok){

      throw new Error(
        "Gagal mengambil paket lisensi."
      );

    }

    packages=
      await response.json();

  }catch(error){

    console.error(
      "LOAD PACKAGES ERROR:",
      error
    );

    packages=[];

  }

}


/* =========================================================
   UPDATE STATISTICS
========================================================= */

function updateStats(){

  const total=
    payments.length;

  const pending=
    payments.filter(
      p =>
        String(p.status||"").toLowerCase()
        ==="pending"
    ).length;

  const approved=
    payments.filter(
      p =>
        ["approved","paid"].includes(
          String(p.status||"").toLowerCase()
        )
    ).length;

  const totalEl=
    document.getElementById("stat-total");

  const pendingEl=
    document.getElementById("stat-pending");

  const approvedEl=
    document.getElementById("stat-approved");

  if(totalEl)
    totalEl.textContent=total;

  if(pendingEl)
    pendingEl.textContent=pending;

  if(approvedEl)
    approvedEl.textContent=approved;

}


/* =========================================================
   RENDER PAYMENTS
========================================================= */

function renderPayments(){

  const panel=
    document.getElementById("payments-panel");

  if(!panel)
    return;

  if(!payments.length){

    panel.innerHTML=
      "<p>Belum ada pembayaran.</p>";

    return;

  }

  let html=`

  <div class="table-wrap">

  <table>

  <thead>

  <tr>

    <th>Pesanan</th>
    <th>Pembeli</th>
    <th>WhatsApp</th>
    <th>Metode</th>
    <th>Jumlah</th>
    <th>Status</th>
    <th>Tanggal</th>
    <th>Bukti</th>
    <th>Aksi</th>

  </tr>

  </thead>

  <tbody>
  `;


  payments.forEach(function(p,index){

    const status=
      String(p.status||"pending")
      .toLowerCase();

    let statusClass="pending";

    if(
      status==="approved" ||
      status==="paid"
    ){

      statusClass="approved";

    }

    if(status==="rejected"){

      statusClass="rejected";

    }

    const amount=
      Number(p.amount||0)
      .toLocaleString(
        "id-ID"
      );

    const date=
      p.created_at
        ? new Date(
            p.created_at
          ).toLocaleString(
            "id-ID"
          )
        : "-";

    const proof=
      p.proof_path
        ? `<span>${esc(p.proof_path)}</span>`
        : "-";

    const alreadyDone=
      status==="approved" ||
      status==="paid" ||
      status==="rejected";


    html+=`

    <tr>

      <td>
        <strong>
          ${esc(p.order_number)}
        </strong>
      </td>

      <td>
        <strong>
          ${esc(p.customer_name)}
        </strong>
        <br>
        ${esc(p.customer_email)}
      </td>

      <td>
        ${esc(p.whatsapp||"-")}
      </td>

      <td>
        ${esc(p.payment_method||"-")}
      </td>

      <td>
        Rp ${amount}
      </td>

      <td>
        <span class="${statusClass}">
          ${esc(status.toUpperCase())}
        </span>
      </td>

      <td>
        ${esc(date)}
      </td>

      <td>
        ${proof}
      </td>

      <td>

        ${
          alreadyDone
          ? `<span class="${statusClass}">
              ${status.toUpperCase()}
            </span>`
          : `
            <button
              class="verify-btn"
              onclick="openVerify(${index})"
            >
              VERIFIKASI
            </button>
          `
        }

      </td>

    </tr>

    `;

  });


  html+=`

  </tbody>

  </table>

  </div>
  `;

  panel.innerHTML=html;

}


/* =========================================================
   OPEN VERIFY MODAL
========================================================= */

async function openVerify(index){

  currentPayment=
    payments[index];

  if(!currentPayment)
    return;

  await loadPackages();

  const select=
    document.getElementById(
      "license-package"
    );

  if(!select)
    return;

  if(!packages.length){

    select.innerHTML=
      `<option value="">
        Paket lisensi tidak ditemukan
      </option>`;

  }else{

    select.innerHTML=
      `<option value="">
        -- Pilih Paket Lisensi --
      </option>`+
      packages.map(function(p){

        return `
        <option value="${esc(p.id)}">
          ${esc(p.name)}
          -
          Rp ${Number(
            p.price||0
          ).toLocaleString("id-ID")}
          -
          ${
            Number(
              p.duration_days||0
            )>0
              ? p.duration_days+" hari"
              : "Tidak terbatas"
          }
        </option>
        `;

      }).join("");

  }

  document.getElementById(
    "verify-order"
  ).textContent=
    currentPayment.order_number||"-";

  document.getElementById(
    "verify-name"
  ).textContent=
    currentPayment.customer_name||"-";

  document.getElementById(
    "verify-email"
  ).textContent=
    currentPayment.customer_email||"-";

  document.getElementById(
    "verify-amount"
  ).textContent=
    "Rp "+
    Number(
      currentPayment.amount||0
    ).toLocaleString("id-ID");

  document.getElementById(
    "mt5-account"
  ).value="";

  document.getElementById(
    "broker"
  ).value="HFM";

  document.getElementById(
    "verification-note"
  ).value="";

  document.getElementById(
    "verify-msg"
  ).innerHTML="";

  document.getElementById(
    "verify-modal"
  ).style.display="flex";

}


function closeVerify(){

  document.getElementById(
    "verify-modal"
  ).style.display="none";

  currentPayment=null;

}


/* =========================================================
   VERIFY PAYMENT
========================================================= */

async function verifyPayment(){

  if(!currentPayment){

    return;
  }

  const packageId=
    document.getElementById(
      "license-package"
    ).value;

  const mt5Account=
    document.getElementById(
      "mt5-account"
    ).value.trim();

  const broker=
    document.getElementById(
      "broker"
    ).value.trim();

  const note=
    document.getElementById(
      "verification-note"
    ).value.trim();

  const msg=
    document.getElementById(
      "verify-msg"
    );

  if(!packageId){

    msg.innerHTML=
      `<div class="msg err">
        Pilih paket lisensi.
      </div>`;

    return;

  }

  if(!mt5Account){

    msg.innerHTML=
      `<div class="msg err">
        Masukkan nomor akun MT5/HFM.
      </div>`;

    return;

  }

  if(!broker){

    msg.innerHTML=
      `<div class="msg err">
        Masukkan nama broker.
      </div>`;

    return;

  }

  const button=
    document.getElementById(
      "verify-submit"
    );

  button.disabled=true;

  button.textContent=
    "MEMPROSES...";

  msg.innerHTML=
    `<div class="msg">
      Sedang membuat lisensi...
    </div>`;


  try{

    const response=
      await fetch(
        "/.netlify/functions/verify-payment",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({

            order_number:
              currentPayment.order_number,

            package_id:
              packageId,

            mt5_account:
              mt5Account,

            broker:
              broker,

            verification_note:
              note

          })
        }
      );


    const data=
      await response.json();


    if(!response.ok ||
       !data.success){

      throw new Error(
        data.message ||
        "Verifikasi gagal."
      );

    }


    const license=
      data.license || {};


    msg.innerHTML=`

      <div class="result">

        <strong>
          PEMBAYARAN BERHASIL DIVERIFIKASI
        </strong>

        <p>
          License Key:
        </p>

        <div class="license-key">
          ${esc(
            license.license_key||"-"
          )}
        </div>

        <p>
          Paket:
          ${esc(
            license.package_name||"-"
          )}
        </p>

        <p>
          Akun MT5:
          ${esc(
            license.mt5_account||"-"
          )}
        </p>

        <p>
          Broker:
          ${esc(
            license.broker||"-"
          )}
        </p>

        <p>
          Status:
          <strong>ACTIVE</strong>
        </p>

        <p>
          License Key sudah dibuat.
          Email lisensi akan dikirim ke pembeli.
        </p>

      </div>

    `;


    button.style.display="none";


    await loadPayments();


  }catch(error){

    console.error(
      "VERIFY ERROR:",
      error
    );

    msg.innerHTML=
      `<div class="msg err">
        ${esc(error.message)}
      </div>`;

    button.disabled=false;

    button.textContent=
      "KONFIRMASI & BUAT LISENSI";

  }

}

/* =========================================================
   INIT
========================================================= */

async function init(){

  if(
    !window.GH_SUPABASE_URL ||
    !window.GH_SUPABASE_PUBLISHABLE_KEY ||
    window.GH_SUPABASE_PUBLISHABLE_KEY===
      "PASTE_PUBLISHABLE_KEY_HERE"
  ){

    app.innerHTML=`
      <div class="box">

        <h2>
          Konfigurasi belum lengkap
        </h2>

        <p>
          Isi Publishable Key di config.js.
        </p>

      </div>
    `;

    return;

  }


  sb=
    window.supabase.createClient(
      window.GH_SUPABASE_URL,
      window.GH_SUPABASE_PUBLISHABLE_KEY
    );


  sb.auth.onAuthStateChange(
    function(event,session){

      if(
        event==="PASSWORD_RECOVERY"
      ){

        showNewPassword();

        return;

      }

      if(session){

        dashboard();

      }else{

        showLogin();

      }

    }
  );


  const {
    data:{session}
  }=
    await sb.auth.getSession();


  if(
    location.hash.includes(
      "type=recovery"
    )
  ){

    showNewPassword();

  }else if(session){

    dashboard();

  }else{

    showLogin();

  }

}


init();

</script>

</body>
</html>
